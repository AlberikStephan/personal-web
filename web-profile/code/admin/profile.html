<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Profile &amp; About</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin">
<script>window.BASE = "../../";</script>
<header id="admin-top"></header>
<div class="admin-layout">
  <aside id="admin-side"></aside>
  <main id="admin-main" class="admin-main"></main>
</div>
<script src="../data/profile.js"></script>
<script src="../js/common.js"></script>
<script src="../js/github.js"></script>
<script src="../js/admin.js"></script>
<script>
  if (Admin.requireAuth()) {
    Admin.chrome("profile");
    var p = window.PROFILE || {};
    var s = p.socials || {};
    var fields = [
      { name: "name", label: "Display name", type: "text" },
      { name: "location", label: "Location", type: "text" },
      { name: "tagline", label: "Role tagline", type: "text" },
      { name: "availability", label: "Availability line", type: "text" },
      { name: "heroIntro", label: "Hero intro (top of Home)", type: "textarea" },
      { name: "heroImage", label: "Hero image (top of Home)", type: "image", hint: "Upload the ASCII / portrait image shown at the top of Home." },
      { name: "photo", label: "Profile photo (About section)", type: "image", crop: true, round: true, hint: "Upload a photo — you can crop it to a circle right here before saving." },
      { name: "aboutHeading", label: "About heading", type: "text" },
      { name: "about", label: "About text", type: "paragraphs", hint: "Leave a blank line between paragraphs." },
      { name: "instagram", label: "Instagram URL", type: "text" },
      { name: "linkedin", label: "LinkedIn URL", type: "text" },
      { name: "email", label: "Email", type: "text" }
    ];
    var current = {
      name: p.name, location: p.location, tagline: p.tagline, availability: p.availability,
      heroIntro: p.heroIntro, heroImage: p.heroImage, photo: p.photo,
      aboutHeading: p.aboutHeading, about: p.about || [],
      instagram: s.instagram, linkedin: s.linkedin, email: s.email
    };

    var main = document.getElementById("admin-main");
    main.innerHTML =
      '<h1 style="margin:0 0 6px; font-family:var(--serif); font-weight:500; font-size:30px; color:var(--ink);">Profile &amp; About</h1>' +
      '<p style="margin:0 0 20px; font-size:14.5px; color:var(--muted2);">Edit the photo and text in the About section and your name/tagline on Home.</p>' +
      '<div class="note">Static site: fill the form &rarr; <b>Generate file</b> &rarr; <b>Download</b> and replace <code>code/data/profile.js</code>. Then reload the site.</div>' +
      '<div class="panel">' + fields.map(function (f) { return Admin.fieldHTML(f, current[f.name]); }).join("") +
        '<div class="actions" style="justify-content:flex-start; align-items:center;">' +
          '<button type="button" class="btn btn-primary" id="pub">Publish to GitHub</button>' +
          '<button type="button" class="btn" id="gen">Download file instead</button>' +
          '<span id="pub-status" style="font-size:13.5px; margin-left:4px;"></span>' +
        '</div>' +
      "</div>" +
      '<div class="output" id="output" style="display:none;"></div>';

    Admin.wireFields(main);

    function buildText() {
      var o = {}; fields.forEach(function (f) { o[f.name] = Admin.readField(f); });
      var obj = {
        name: o.name, location: o.location, tagline: o.tagline, availability: o.availability,
        heroIntro: o.heroIntro, heroImage: o.heroImage, photo: o.photo,
        aboutHeading: o.aboutHeading, about: o.about,
        socials: { instagram: o.instagram, linkedin: o.linkedin, email: o.email }
      };
      return "/* Auto-generated by the admin panel. You can also edit this by hand. */\n" +
        "window.PROFILE = " + JSON.stringify(obj, null, 2) + ";\n";
    }
    function setStatus(msg, kind) {
      var s = document.getElementById("pub-status");
      s.textContent = msg;
      s.style.color = kind === "err" ? "#b91c1c" : (kind === "ok" ? "#166534" : "var(--muted2)");
    }
    var pub = document.getElementById("pub");
    pub.addEventListener("click", function () {
      if (!window.GH || !GH.configured()) { setStatus("Set up GitHub first on the Settings page.", "err"); return; }
      pub.disabled = true; setStatus("Publishing…");
      GH.publishData("profile.js", buildText())
        .then(function () { setStatus("Published! Your site updates in ~1 minute.", "ok"); })
        .catch(function (e) { setStatus(e.message, "err"); })
        .then(function () { pub.disabled = false; });
    });

    document.getElementById("gen").addEventListener("click", function () {
      var text = buildText();
      var out = document.getElementById("output");
      out.style.display = "block";
      out.innerHTML =
        '<h3 style="margin:24px 0 10px; font-family:var(--serif); font-weight:500; font-size:19px; color:var(--ink);">Updated data file</h3>' +
        '<p class="hint" style="margin-top:0;">Download and replace <code>code/data/profile.js</code>, then reload.</p>' +
        '<textarea readonly>' + U.esc(text) + "</textarea>" +
        '<div class="actions" style="justify-content:flex-start; margin-top:12px;"><button type="button" class="btn btn-primary" id="dl">Download profile.js</button><button type="button" class="btn" id="cp">Copy text</button></div>';
      document.getElementById("dl").addEventListener("click", function () { Admin.download("profile.js", text); });
      document.getElementById("cp").addEventListener("click", function () {
        out.querySelector("textarea").select();
        try { navigator.clipboard.writeText(text); } catch (e) { document.execCommand("copy"); }
        this.textContent = "Copied!";
      });
      out.scrollIntoView({ behavior: "smooth" });
    });
  }
</script>
</body>
</html>
