<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>window.BASE = "../";</script>

<div style="width:100%; min-height:100vh; background:#B6B0A7; display:flex; align-items:center; justify-content:center; padding:40px 24px; font-family:var(--sans);">
  <div style="width:100%; max-width:420px; background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:20px; box-shadow:0 30px 60px -30px rgba(0,0,0,.35); padding:40px 36px; text-align:center;">
    <div style="width:52px; height:52px; border-radius:14px; background:#18181b; color:#fff; display:grid; place-items:center; margin:0 auto 22px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 118 0v4"></path></svg>
    </div>
    <h1 style="margin:0; font-family:var(--serif); font-weight:500; font-size:28px; color:#18181b;">Admin Sign In</h1>
    <p style="margin:10px 0 0; font-size:15px; color:var(--muted2);">Sign in to manage your site content.</p>

    <form id="login-form" style="margin-top:28px; text-align:left;">
      <div class="field"><label for="u">Username</label><input id="u" type="text" autocomplete="username" placeholder="admin username"></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Enter password"></div>
      <p id="err" style="display:none; color:#b91c1c; font-size:13.5px; margin:0 0 12px;">Wrong username or password.</p>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign in
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </form>

    <a href="../index.html" style="display:inline-block; margin-top:20px; font-size:13.5px; font-weight:600; color:var(--muted2);">&larr; Back to site</a>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  /* Change these credentials to your own. */
  var ADMIN_USER = "admin";
  var ADMIN_PASS = "admin123";

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("u").value.trim();
    var p = document.getElementById("p").value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      try { sessionStorage.setItem("adminAuthed", "1"); } catch (err) {}
      window.location.href = R("code/admin/articles.html");
    } else {
      document.getElementById("err").style.display = "block";
    }
  });
</script>
</body>
</html>
