<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail — Alberik Stephan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-in">
<script>window.BASE = "../";</script>

<header id="site-nav"></header>

<main>
  <section class="wrap" style="max-width:1180px; padding-block:32px 80px;">
    <a class="back" id="d-back" href="collections.html"></a>
    <div id="d-body" style="display:flex; flex-wrap:wrap; gap:40px; align-items:flex-start;"></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="data/profile.js"></script>
<script src="data/photos.js"></script>
<script src="data/nfts.js"></script>
<script src="js/common.js"></script>
<script>
  (function () {
    Layout.renderNav("collections");
    Layout.renderFooter({ admin: false });

    var back = document.getElementById("d-back");
    back.innerHTML = ICON.back + " Back to collections";
    back.href = R("code/collections.html");

    var type = U.getParam("type") === "nft" ? "nft" : "photo";
    var id = U.getParam("id");
    var list = type === "nft" ? (window.NFTS || []) : (window.PHOTOS || []);
    var item = list.filter(function (x) { return x.id === id; })[0];
    var body = document.getElementById("d-body");
    if (!item) {
      body.innerHTML = '<p style="color:var(--muted2);">Item not found. <a style="color:var(--ink); font-weight:600;" href="' + R("code/collections.html") + '">Back to collections</a>.</p>';
      return;
    }
    var title = item.title || item.name || "";
    var badge = item.collection || (type === "nft" ? "NFT" : "Photo");
    document.title = title + " — Alberik Stephan";

    var specsRows = [
      ["Chain", item.chain],
      ["Camera", item.camera], ["Lens", item.lens], ["Aperture", item.aperture],
      ["Shutter", item.shutter], ["ISO", item.iso], ["Focal length", item.focal]
    ].filter(function (r) { return r[1]; });
    var linkBtn = item.link
      ? '<a class="btn btn-primary" style="margin-top:22px;" href="' + U.esc(item.link) + '" target="_blank" rel="noopener">View NFT ' + ICON.arrow + "</a>"
      : "";
    var specs = specsRows.length
      ? '<h2 style="margin:28px 0 12px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);">Specs</h2>' +
        '<dl class="spec">' + specsRows.map(function (r) {
          return "<dt>" + U.esc(r[0]) + "</dt><dd>" + U.esc(r[1]) + "</dd>";
        }).join("") + "</dl>"
      : "";

    var meta = [];
    if (item.date) meta.push(U.fmtDate(item.date));
    if (item.location) meta.push(item.location);

    body.innerHTML =
      '<div style="flex:999 1 460px; min-width:0;">' +
        '<div style="width:100%; aspect-ratio:3/2; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:var(--line2);">' +
          '<img src="' + R(item.image || "image/placeholder.svg") + '" alt="' + U.esc(title) + '" style="width:100%; height:100%; object-fit:cover;"></div>' +
      "</div>" +
      '<aside style="flex:1 1 320px; min-width:0;">' +
        '<span style="display:inline-block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#fff; background:var(--ink); border-radius:999px; padding:4px 12px;">' + U.esc(badge) + "</span>" +
        '<h1 style="margin:16px 0 0; font-family:var(--serif); font-weight:500; font-size:34px; line-height:1.1; color:var(--ink);">' + U.esc(title) + "</h1>" +
        (meta.length ? '<p style="margin:12px 0 0; font-size:13.5px; color:var(--faint);">' + U.esc(meta.join(" · ")) + "</p>" : "") +
        (item.story ? '<h2 style="margin:28px 0 10px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);">Story</h2><p style="margin:0; font-size:16px; line-height:1.75; color:#3f3f46;">' + U.esc(item.story) + "</p>" : "") +
        specs + linkBtn +
      "</aside>";
  })();
</script>
</body>
</html>
